plugins {
	id 'java'
	id 'eclipse' // optional (to generate Eclipse project files)
	id 'idea' // optional (to generate IntelliJ IDEA project files)
	id "application"
}

application {
    mainClass = 'io.github.ez500.CS180_GPJ.ClientHandler'
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation(platform('org.junit:junit-bom:6.0.1'))
	testImplementation('org.junit.jupiter:junit-jupiter')
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
	}
}

task runClientHandler(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.ez500.CS180_GPJ.ClientHandler'
}

task runAutoTestClient(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.ez500.CS180_GPJ.AutoTestClient'
}

task runGUIClient(type: JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.ez500.CS180_GPJ.ClientGUI'
}
